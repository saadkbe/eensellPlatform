<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <radialGradient id="discordGrad1" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#3730a3" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95" />
    </radialGradient>
    <radialGradient id="discordGrad2" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1400" height="400" fill="#030712" />
  <rect width="1400" height="400" fill="url(#discordGrad1)" />
  <rect width="1400" height="400" fill="url(#discordGrad2)" />

  <!-- Decorative floating glowing orbs/particles -->
  <circle cx="1050" cy="150" r="24" fill="#818cf8" opacity="0.4" filter="url(#glow)" />
  <circle cx="950" cy="280" r="12" fill="#818cf8" opacity="0.6" filter="url(#glow)" />
  <circle cx="1220" cy="90" r="8" fill="#c7d2fe" opacity="0.8" filter="url(#glow)" />
  <circle cx="880" cy="110" r="16" fill="#6366f1" opacity="0.5" filter="url(#glow)" />
</svg>
