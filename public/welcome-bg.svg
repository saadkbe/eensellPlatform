<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <radialGradient id="grad1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#9a3412" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="grad2" cx="85%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#7c2d12" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="grad3" cx="50%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>
  
  <!-- Deep Dark Base -->
  <rect width="1400" height="400" fill="#030712" />
  
  <!-- Mesh Gradient Layers -->
  <g filter="url(#blur)">
    <circle cx="250" cy="50" r="450" fill="url(#grad1)" />
    <circle cx="1150" cy="320" r="550" fill="url(#grad2)" />
    <circle cx="700" cy="20" r="400" fill="url(#grad3)" />
    <path d="M 100,300 C 400,100 800,350 1200,150 L 1400,400 L 0,400 Z" fill="#7c2d12" opacity="0.25" />
  </g>
</svg>
